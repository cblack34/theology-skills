name: Validate marketplace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv lock --check
      - run: uv run --locked python -m py_compile scripts/new_skill.py scripts/validate.py scripts/bump_plugin_version.py scripts/ci_bump_versions.py
      - run: uv run --locked scripts/validate.py
      - run: uv run --locked python -m unittest discover -s tests
      - name: Smoke-test the skill generator
        run: |
          git clone . "$RUNNER_TEMP/theology-marketplace"
          cd "$RUNNER_TEMP/theology-marketplace"
          uv run --locked scripts/new_skill.py smoke-test \
            --description "Exercise the generated cross-harness plugin structure."
          uv run --locked scripts/validate.py
          cp -R \
            plugins/smoke-test/skills/smoke-test \
            plugins/smoke-test/skills/extra-skill
          if uv run --locked scripts/validate.py; then
            echo "Expected validation to reject a skill directory whose name mismatches its frontmatter."
            exit 1
          fi
